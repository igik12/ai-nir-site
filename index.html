емя как BigTech прогнозирует его к 2027–2030 годам."},{id:4,term:"Narrow AI / ANI (Artificial Narrow Intelligence)",category:"tech",categoryLabel:"Технологии",definition:"Слабый или узкоспециализированный искусственный интеллект. Модели, обученные выполнять строго определенный класс задач (генерация текстов, распознавание лиц, ведение диалога) без осознания реальности.",example:"Все современные флагманские языковые модели (включая GPT-5 2025 года) остаются системами узкого ИИ."},{id:5,term:"Диффузия ответственности (Diffusion of Responsibility)",category:"society",categoryLabel:"Общество и право",definition:"Правовой и этический тупик, возникающий при ошибках автономных ИИ-агентов, когда невозможно однозначно возложить вину за ущерб на разработчика, платформу или конечного пользователя.",example:"Автономный ИИ-агент некорректно удалил базу данных компании — неясно, кто виноват: создатель алгоритма или пользователь, отдавший команду."},{id:6,term:"Зелёный ИИ (Green AI)",category:"ecology",categoryLabel:"Экология",definition:"Подход к проектированию нейросетей, сфокусированный на максимальном снижении углеродного, водного и энергетического следа. Включает разработку компактных алгоритмов и перевод ЦОД на жидкостное охлаждение.",example:"Снижение стоимости вычислений токенов GPT-3.5 более чем в 280 раз за два года за счёт оптимизации кода."},{id:7,term:"Микротаргетинг (Microtargeting)",category:"society",categoryLabel:"Общество и право",definition:"Высокоточное информационное или рекламное воздействие на пользователей на основе ИИ-анализа их психологического профиля, интересов и поведения в социальных сетях.",example:"Генерация ИИ-ботами тысяч уникальных вариантов политического лозунга, нацеленных на разные узкие группы избирателей."},{id:8,term:"Галлюцинация ИИ (AI Hallucination)",category:"tech",categoryLabel:"Технологии",definition:"Явление, при котором большая языковая модель с высокой долей уверенности генерирует фактологически ложные, несуществующие или вымышленн
